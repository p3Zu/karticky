<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kúzelník: vyber si kartu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#2a1740; --bg2:#1a0d2b; --ink:#f6ecd2; --muted:#bfa9d9; --gold:#e8b94a; --onGold:#1a0d2b;
  --card:#fffaf0; --cardInk:#2a1740;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#efe4fa;--bg2:#d9c6ef;--ink:#2a1740;--muted:#5f4780;--gold:#8a5a00;--onGold:#fff}
}
:root[data-theme="light"]{--bg:#efe4fa;--bg2:#d9c6ef;--ink:#2a1740;--muted:#5f4780;--gold:#8a5a00;--onGold:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;background:radial-gradient(ellipse at 50% -10%,var(--bg),var(--bg2) 75%) fixed var(--bg2)}
main{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));display:grid;gap:20px}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);font-weight:800;text-align:center;text-wrap:balance}
.sub{margin:4px 0 0;text-align:center;color:var(--muted);font-size:clamp(.95rem,2.8vw,1.1rem)}
.bar{display:flex;justify-content:center}
.btn{font:inherit;font-weight:700;min-height:48px;padding:12px 24px;touch-action:manipulation;border-radius:999px;border:0;background:var(--gold);color:var(--onGold);cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,2vw,16px)}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);max-width:440px;width:100%;margin:0 auto;gap:12px}
  .bar .btn{width:100%;max-width:440px}
}
.cell{container-type:inline-size}
.slot{display:block;width:100%;perspective:800px;aspect-ratio:5/7;padding:0;border:0;background:none;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.slot:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
@media (hover:hover){.slot:not(.open):hover .inner{transform:translateY(-4px)}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s,opacity .4s}
.slot.open .inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:clamp(8px,6cqw,14px);border:clamp(2px,2cqw,3px) solid var(--gold)}
.back{background:repeating-linear-gradient(45deg,#4b2a78,#4b2a78 8px,#3a1f5f 8px,#3a1f5f 16px);display:grid;place-items:center;color:#e8b94a;font-size:2rem;font-size:30cqw}
.front{transform:rotateY(180deg);background:var(--card);color:var(--cardInk);display:grid;place-items:center;padding:8%;text-align:center;font-weight:800;line-height:1.25;overflow:hidden;overflow-wrap:anywhere;hyphens:auto;font-size:var(--fb,1.2rem);font-size:calc(var(--k,12) * 1cqw)}
.picked .slot:not(.open){pointer-events:none}
.picked .slot:not(.open) .inner{opacity:.25}
.slot.open .side{box-shadow:0 0 28px var(--gold)}
.shuffling .slot{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(6px,-6px) rotate(3deg)}75%{transform:translate(-6px,6px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.shuffling .slot{animation:none}}
</style>
</head>
<body>
<main>
  

  <div class="grid" id="grid"></div>
  <div class="bar"><button class="btn" id="reset">Resetovať a premiešať</button></div>
</main>

<script>
/* =====================================================
   TU SI NAPÍŠ SVOJICH 50 ODKAZOV.
   Každý riadok je jeden odkaz v úvodzovkách, na konci čiarka.
   Pri každom načítaní a resete sa z nich náhodne vyberie 10.
   ===================================================== */
const MESSAGES = [
  "laska lubim ta velmi moc",
  "som hrdy na teba",
  "milujem ta",
  "vzdy ked ta vidim tak si uvedomim aky som stastny ze ta mam",
  "prejem ti vsetko najlepsie do zivota",
  "vzdy ta budem lubit",
  "chybas mi velmi moc",
  "les kedy?",
  "budeme mat dlhy krasny zivot",
  "akej farby je tvoja corvetta",
  "vacsinu casu myslim na teba",
  "dakujem ze si so mnou aj v tych zlych aj dobrych chvilach",
  "vzdy ked som s tebou tak som najstastejsi",
  "buduca pani legatova",
  "si uzasna",
  "kazda gym sesh je uzasna",
  "kedy kuchyna",
  "dost mi pomhas laska",
  "dakujem za vsetko",
  "ten donut ta caka",
  "na mna nepotrebujes vodicak(to je joke)",
  "velmi sa ti ospravedlnujem za to co som spravil",
  "what happens in the deep strech",
  "si dovod preco sa chcem zlepsovat",
  "si to ty vs ty",
  "ziadne miesto na svete sa nevie porovnat s tebou",
  "lowkey the 4 month wait sa oplatil",
  "diki za turnaj",
  "je to na papiery",
  "mna sa uz nezbavis",
  "neviem sa dockat na nasu buducnost spolu",
  "prepac za vtipy ty vies ktore",
  "aj ked ta v ten den nevidim tak si nadherna",
  "si az tak pekna ze som jak pariz(chapes????)",
  "mommy",
  "we dont actually know",
  "moja draha si clovek pri ktorom chcem stravit aj to zle a aj to dobre",
  "moje najlepsie kuzlo bolo to ze som pullol teba",
  "chcem ta urobit tou najstastnejsou na svete",
  "can i get another mango",
  "som rad ze si si ma vybrala",
  "moja true stacy",
  "som rad za kazdu chvilu co mozme byt spolu",
  "kedy bp club na bilicke",
  "nech si eliska countuje svoje days a spi s otvorenymi ocami",
  "si to najkrajsie dievca ktore som mohol kedy stretnut",
  "si velmi svalnata ale ze mnam",
  "si velmi mile dievca",
  "prajem ti nech budes uspesna",
  "laska moja jedina vzdy ked ta vidim tak si uvedomujem aky som lucky ze ta mam "
];
const CARDS_ON_TABLE = 10;
/* ===================================================== */

const grid=document.getElementById('grid');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function deal(){
  grid.innerHTML='';
  grid.classList.remove('picked');
  const hand=shuffle([...MESSAGES]).slice(0,CARDS_ON_TABLE);
  hand.forEach((text,i)=>{
    const cell=document.createElement('div');
    cell.className='cell';
    const b=document.createElement('button');
    b.className='slot';
    b.setAttribute('aria-label','Karta '+(i+1)+' z '+hand.length+', rubom hore');
    b.innerHTML='<div class="inner"><div class="side back">✦</div><div class="side front"></div></div>';
    const front=b.querySelector('.front');
    front.textContent=text;
    // veľkosť písma sa prispôsobí šírke karty (cqw) aj dĺžke odkazu
    front.style.setProperty('--k',text.length>140?6.2:text.length>80?7.6:text.length>40?9.5:12);
    front.style.setProperty('--fb',text.length>140?'.8rem':text.length>80?'.95rem':text.length>40?'1.15rem':'1.4rem');
    b.onclick=()=>{
      b.classList.add('open');
      grid.classList.add('picked');
      b.setAttribute('aria-label','Odkaz: '+text);
    };
    cell.appendChild(b);
    grid.appendChild(cell);
  });
}

document.getElementById('reset').onclick=()=>{
  grid.classList.add('shuffling');
  setTimeout(()=>{grid.classList.remove('shuffling');deal()},450);
};
deal();
</script>
</body>
</html>
